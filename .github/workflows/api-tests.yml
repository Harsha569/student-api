name: API tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
      - run: npm ci
      - run: pip install pytest requests
      - run: node server.js & sleep 2; pytest -q test_api.py
